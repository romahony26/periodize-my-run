<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<title>Periodize My Run</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Periodize My Run">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%235b5bf0'/%3E%3Cstop offset='1' stop-color='%2319c2a0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12' fill='url(%23g)'/%3E%3Cpath d='M10 34l6.5-7 4.5 3.5 6-9.5 4.5 3.5L38 13' fill='none' stroke='%23fff' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='38' cy='13' r='3.4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f7f7f5;--surface:#fff;--ink:#14161a;--ink2:#3a3f47;--mute:#5f656e;--line:#e8e7e3;--hover:#f1f0ed;
  --brand:#5b5bf0;--brand2:#19c2a0;--grad:linear-gradient(135deg,#5b5bf0,#19c2a0);
  --key:#96600a;--long:#c2410c;--race:#be185d;--easy:#157347;--rest:#6b7280;
  --green:#157347;--amber:#8a5a00;--red:#b3261e;
  --shadow:0 1px 2px rgba(20,22,26,.04),0 8px 24px -12px rgba(20,22,26,.12);--r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0f12;--surface:#15181d;--ink:#f1f2f4;--ink2:#c9cdd3;--mute:#9aa1ab;--line:#242930;--hover:#1c2026;
  --key:#f5b63d;--long:#ff8a66;--race:#ff5c9c;--easy:#4cd08a;--rest:#5d646e;--green:#4cd08a;--amber:#f5b63d;--red:#ff6b62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:30px;height:30px;display:block;filter:drop-shadow(0 4px 10px rgba(91,91,240,.35))}
.logo b{font-size:18px;font-weight:720;letter-spacing:-.035em}
.tabs{display:flex;gap:2px;background:var(--hover);padding:3px;border-radius:999px;margin:0 auto}
.tabs:empty{display:none}
.tabs button{border:0;background:none;color:var(--mute);font:inherit;font-weight:560;font-size:13.5px;padding:6px 14px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
.dot.busy{background:var(--brand);animation:pulse 1.1s infinite}.dot.bad{background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent)}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
main{max-width:1200px;margin:0 auto;padding:22px 20px 80px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);grid-column:span 4;min-width:0;overflow-x:auto}
.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.eyebrow{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.h{font-size:22px;font-weight:720;letter-spacing:-.03em;line-height:1.2;margin:0}
.big{font-size:34px;font-weight:740;letter-spacing:-.045em;line-height:1.05}
.mute{color:var(--mute)}.small{font-size:13px}.xs{font-size:12px}
.hero{overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--brand) 16%,var(--surface)),var(--surface) 58%);position:relative;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:color-mix(in srgb,var(--surface) 70%,var(--bg));border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-size:20px;font-weight:720;letter-spacing:-.03em}
.stat .k{font-size:11.5px;color:var(--mute)}
.ring{position:absolute;right:18px;top:16px;width:74px;height:74px}
.ring text{font:700 15px Inter,ui-sans-serif,sans-serif;fill:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:620;background:color-mix(in srgb,currentColor 12%,transparent);text-transform:none;letter-spacing:0}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.unknown{color:var(--mute)}
.steps{list-style:none;margin:12px 0 0;padding:0;border-left:2px solid var(--line)}
.steps li{position:relative;padding:3px 0 3px 14px;font-size:13.5px;color:var(--ink2)}
.steps li:before{content:"";position:absolute;left:-5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
ul.why{margin:10px 0 0;padding:0;list-style:none}
ul.why li{font-size:13px;color:var(--ink2);padding:6px 0;border-top:1px solid var(--line)}
ul.why li:first-child{border-top:0}
.wk{display:flex;align-items:baseline;gap:10px;margin:22px 2px 8px;flex-wrap:wrap}
.wk b{font-size:14px;font-weight:680;letter-spacing:-.01em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{scroll-margin:84px 0 24px;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 11px 11px 14px;min-height:112px;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column}
.day:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--t,transparent)}
.day.Key{--t:var(--key)}.day.Long{--t:var(--long)}.day.Race{--t:var(--race)}.day.Easy{--t:var(--easy)}.day.Rest{--t:var(--rest)}
.day.past{background:var(--bg)}.day.past .l,.day.past .m{color:var(--mute)}.day.past:before{opacity:.45}.day.today{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.day[draggable=true]{cursor:grab}.day[draggable=true]:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.day.drag{opacity:.4}.day.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
.day .d{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);font-weight:560;text-transform:uppercase;letter-spacing:.06em}
.day .l{font-weight:660;font-size:13.5px;margin-top:6px;line-height:1.25;letter-spacing:-.01em}
.day .m{font-size:19px;font-weight:730;letter-spacing:-.04em;color:var(--t)}
.day .t{font-size:11.5px;color:var(--mute);line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.day .mt{display:flex;gap:8px;font-size:11.5px;color:var(--mute);border-top:1px solid var(--line);margin-top:6px;padding-top:5px;flex-wrap:wrap}.day.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--surface))}.day{cursor:pointer}
.day .f{margin-top:auto;padding-top:6px;font-size:11.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;font-weight:620;padding:1px 7px;border-radius:999px;background:var(--hover);color:var(--ink2)}
.done{color:var(--green);font-weight:650}
.sout{display:flex;gap:3px;overflow-x:auto;padding:4px 0 2px;align-items:flex-end}
.sw{flex:1 0 26px;display:flex;flex-direction:column;align-items:center;min-width:26px;border-radius:6px;outline-offset:2px}
.sw:hover,.sw:focus{background:var(--hover)}
.sv{font-size:10.5px;color:var(--ink2);line-height:1.6}
.sbar{height:84px;width:70%;display:flex;align-items:flex-end}.sbar i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--brand)}
.sr{height:15px;font-size:11px;line-height:15px}.ra{color:var(--race)}.rb{color:var(--amber)}
.sd{font-size:10px;color:var(--mute);white-space:nowrap;height:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}th{color:var(--mute);font-weight:560;font-size:12px}
td.r,th.r{text-align:right;white-space:nowrap}th{white-space:nowrap}td,th{padding-right:18px}td:last-child,th:last-child{padding-right:0}
input,select,button{font:inherit;color:inherit}
input,select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);max-width:100%;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
label,.lab{display:block;margin:14px 0 5px;font-size:12.5px;font-weight:560;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:0;background:var(--grad);color:#fff;font-weight:640;cursor:pointer;text-decoration:none;box-shadow:0 6px 16px -8px rgba(91,91,240,.7);transition:.15s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.ghost{display:inline-flex;align-items:center;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:560;text-decoration:none;transition:.15s}
.ghost:hover{background:var(--hover)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{margin:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 10px;border-radius:999px;cursor:pointer;font-weight:520}
.checks input{padding:0;accent-color:var(--brand)}
.chart{display:flex;align-items:flex-end;gap:3px;height:64px;padding-top:22px}.chart .b{flex:1;min-width:4px;border-radius:3px 3px 0 0;background:var(--grad);opacity:.8;position:relative;cursor:default;outline:none}.chart .b:hover,.chart .b:focus{opacity:1}.chart .b:hover::after,.chart .b:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none}.chart .b:first-child:hover::after,.chart .b:first-child:focus::after{left:0;transform:none}.chart .b:last-child:hover::after,.chart .b:last-child:focus::after{left:auto;right:0;transform:none}
.lc{position:relative;outline:none;cursor:crosshair;touch-action:pan-y}.lc:focus-visible{box-shadow:0 0 0 2px var(--brand);border-radius:6px}.lc .cur,.lc .pt,.lc .tp{display:none;position:absolute;pointer-events:none}.lc.on .cur,.lc.on .pt,.lc.on .tp{display:block}
.lc .cur{top:0;bottom:0;width:1px;background:var(--ink);opacity:.35}.lc .pt{width:8px;height:8px;border-radius:50%;margin:-4px 0 0 -4px;box-shadow:0 0 0 2px var(--surface)}.lc .tp{top:-20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:600;font-style:normal;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:5}
.dw{position:relative;min-width:0;display:flex}.dw>.day{flex:1;min-width:0}.gl.corner{position:absolute;top:5px;right:6px;z-index:2}
.gl{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;vertical-align:middle}.gl:hover,.gl:focus-visible{background:var(--hover)}.gl svg{width:13px;height:13px;display:block}
.rmap{position:relative;width:100%;aspect-ratio:600/340;overflow:hidden;border-radius:12px;background:var(--hover)}.rmap img{position:absolute;display:block;max-width:none}.rmap svg{position:absolute;inset:0;width:100%;height:100%}
.rmap .mzoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}.rmap .mzoom button{width:32px;height:32px;padding:0;background:#fff;color:#14161a;font-size:17px;border:1px solid #cfcfcf}.rmap .mattr{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.85);color:#14161a;font-size:10.5px;padding:1px 6px;border-top-left-radius:6px}
.explain{background:var(--hover);border-radius:12px;padding:12px 14px;margin-top:8px}.sc[title],span[title]{cursor:help}
.sgrid{align-items:start}.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 22px}.fgrid input,.fgrid select{width:100%;max-width:100%}.fgrid label{margin-top:10px}
.sechead{grid-column:1/-1;margin-top:14px}.sechead h2{font-size:18px;margin:0 0 2px;letter-spacing:-.01em}.sechead p{margin:0}
.c6{grid-column:span 6}.conn .chead{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:15.5px}.conn .cicon{width:34px;height:34px;border-radius:10px;background:var(--hover);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.clist{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink2)}.clist li{margin:3px 0}.cact{margin:14px 0 0}
.csteps{margin:10px 0 0;padding-left:20px;font-size:13.5px}.csteps>li{margin:0 0 14px;padding-left:4px}.csteps>li::marker{font-weight:700;color:var(--brand)}
.copyrow{display:flex;gap:8px;align-items:center;margin-top:6px}.copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--hover);padding:7px 9px;border-radius:8px;font-size:12px}
.ver .why{margin-top:4px}
.sc{display:inline-block;min-width:38px;text-align:center;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,currentColor 13%,transparent)}
.bar{height:6px;border-radius:999px;background:var(--hover);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--grad);border-radius:999px}
.alert{border:1px solid var(--line);border-left:4px solid var(--amber);background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.alert.err{border-left-color:var(--red)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:560;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:min(92vw,560px);box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--red);color:#fff}#toast.warn{background:var(--amber);color:#111}
pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:64vh;overflow:auto;margin:0;color:var(--ink2)}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--hover);padding:1px 6px;border-radius:6px}
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px 14px;overflow:auto}.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;width:min(640px,100%);box-shadow:0 30px 80px -20px rgba(0,0,0,.55)}.lab2{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:16px 0 0}
.wiz{max-width:600px;margin:5vh auto 0}
.wiz .card{padding:28px}
.brandhead{text-align:center;margin-bottom:22px}
.brandhead svg{width:64px;height:64px;filter:drop-shadow(0 12px 24px rgba(91,91,240,.4))}
.brandhead h1{margin:14px 0 4px;font-size:30px;font-weight:760;letter-spacing:-.045em}
.stepper{display:flex;gap:6px;margin-bottom:18px}.stepper i{flex:1;height:4px;border-radius:99px;background:var(--hover)}.stepper i.on{background:var(--grad)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:900px){
  .card,.c6,.c8{grid-column:span 12}
  .cal{grid-template-columns:1fr}.day{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px}.day .d{width:100%}.day .t{width:100%;-webkit-line-clamp:3}.day .f{margin:0;padding:0}.day .l{margin:0}
  .top .in{flex-wrap:wrap;gap:10px}.tabs{order:3;width:100%;overflow-x:auto;justify-content:flex-start;margin:0}.sync{margin-left:auto}
  main{padding:16px 14px 80px}.big{font-size:28px}
}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="logo" href="/" aria-label="Periodize My Run">
    <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5b5bf0"/><stop offset="1" stop-color="#19c2a0"/></linearGradient></defs>
      <rect width="48" height="48" rx="12" fill="url(#lg)"/><path d="M10 34l6.5-7 4.5 3.5 6-9.5 4.5 3.5L38 13" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="13" r="3.4" fill="#fff"/></svg>
    <b>periodize my run</b></a>
  <div class="tabs" id="nav"></div>
  <div class="sync" id="sync"></div>
</div></div>
<main id="main"></main>
<div id="toast"></div>
<script src="/static/app.js" defer></script>
</body>
</html>
